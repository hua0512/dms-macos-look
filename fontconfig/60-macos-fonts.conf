<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- macOS fonts: SF Pro for the UI and the web's system-font names. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro</family>
      <family>PingFang SC</family>
      <family>Apple Color Emoji</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro</string></edit>
  </match>
</fontconfig>
